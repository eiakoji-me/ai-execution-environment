- id: claude-code-interface
  status: in-progress
  progress:
    - Phase 1 (interactive parity) completed in 01be556.
    - Phase 2 (stage subagents) completed in b8ed9fa; Phase 3 and remaining platform wiring are open.
  summary: Add native Claude Code support as a first-class interface alongside Codex and Antigravity, using thin adapters over the tool-neutral workflow definitions.
  decisions:
    - Choose the skill source of truth (recommended: .agents/skills/ canonical, synced into .codex/ and .claude/).
    - Choose the in-container Claude credential model (subscription login under .local/state/claude or an API key from host-local secret storage).
  steps:
    # Phase 1: interactive parity (done)
    - Add root CLAUDE.md that imports AGENTS.md and points to the work-item and onboarding skills.
    - Add .claude/skills/work-item-execution/SKILL.md and .claude/skills/repository-onboarding/SKILL.md identical to .agents/skills/.
    - Add tracked .claude/settings.json denying reads of .env, .env.* and .local/state/**, denying edits under repos/**, and allowing platform scripts.
    - Add a PreToolUse hook that requires approval for git push, git clone, and pull-request creation.
    - Ignore .claude/settings.local.json and CLAUDE.local.md in .gitignore.
    - Name ~/.claude/CLAUDE.md as the operator-wide rules location in AGENTS.md.
    # Phase 2: stage subagents (done)
    - Generate .claude/agents/<stage>.md wrappers from platform/workflows/agents/ with a generator script; wrappers reference the stage file and never duplicate it.
    - Restrict non-code stages (issue-refinement, solution-designer, code-reviewer) to editing work-item records only, through a subagent-scoped write hook; they still need Edit and Write for artifacts and state.
    - Fail validation when generated wrappers are stale.
    # Phase 3: runtime and credentials
    - Add the pinned Claude Code devcontainer feature and update devcontainer-lock.json.
    - Mount .local/state/claude into the runtime and set CLAUDE_CONFIG_DIR; never forward host ANTHROPIC_API_KEY implicitly.
    - Make setup name the Claude account it will use and require operator confirmation.
    - Implement a claude adapter for headless stage execution (claude -p per stage via devcontainer exec), coordinated with orchestration-engine.
    # Platform wiring
    - Detect claude in setup.sh plan and explain its credential location when --interface claude is selected.
    - Report claude in doctor.sh as optional, not required.
    - Extend validate.sh with .claude and CLAUDE.md required and portable paths, settings.json parsing, and SKILL.md parity across .agents, .codex and .claude.
    - Add .claude and CLAUDE.md to architecture/sync-scaffold.sh.
    - Update architecture/pipeline-and-agents.md, setup-guide.md, install-and-portability.md and README.md.
    - Add an --interface claude case to platform/tests/setup-profiles.sh.
  related:
    - orchestration-engine

- id: host-credential-scoping
  status: in-progress
  summary: Superseded by identity profiles (issue #5), which scope every host and container Git and provider operation to a named, per-project identity.
  issue: https://github.com/eiakoji-me/ai-execution-environment/issues/5
  related:
    - claude-code-interface

- id: runtime-cli
  status: in-progress
  progress:
    - Added top-level platform dispatcher CLI platform/cli.sh and bin/aee covering runtime, slots, worktrees, repos, work-items, identity, context, setup, doctor, and validate.
    - Added dedicated runtime CLI entrypoints platform/runtime/runtime.sh and platform/runtime/scripts/runtime.sh.
    - Added CLI test suite in platform/tests/runtime-cli.sh and updated validation and sync scaffold.
  summary: Provide a unified platform and runtime CLI that drives setup, worktree and slot operations, work-item execution, and LLM model/provider configuration.
  context: >-
    Operators and agents currently invoke individual shell scripts under platform/install/, platform/repositories/,
    platform/workspace-scaffolder/, platform/runtime/scripts/, and platform/context/scripts/. A single command surface
    can unify environment setup, repository onboarding, worktree/slot lifecycle, and LLM model registration without
    duplicating underlying script logic.
  decisions:
    - Choose the CLI binary name and entrypoint location (e.g. platform/cli.sh exposed as aee or ai-env).
    - Define the model and provider configuration schema (tracked defaults vs. operator-local .local/config/models.json).
  steps:
    - Add a top-level dispatcher CLI (setup, doctor, repos, work-items, worktrees, slots, runtime, context, models) delegating to platform scripts.
    - Support interactive and non-interactive setup flows (plan, apply, auth verification, and project registration).
    - Add LLM model and provider management subcommands (models list, add, remove, set-default, bind-stage) across Codex, Claude Code, Antigravity/Gemini, and custom/local endpoints.
    - Wire model credentials and runtime container mounts through .local/state/ without storing secrets in tracked files.
    - Add CLI integration tests and update architecture documentation.
  related:
    - orchestration-engine
    - claude-code-interface
    - host-credential-scoping

- id: shareable-sdd-platform
  status: open
  summary: Package and publish aee as an open-source, spec-driven development platform with containerized LLM processing, multi-VCS trust isolation, and LSM-tree memory.
  context: >-
    Transforms the workspace control plane into a standalone, shareable developer tool for spec-driven
    development (SDD). Features an isolated LLM processor container (Input -> LLM Container -> Output),
    workflow classification layer (spec-to-pr, runbook, investigation, docs), and multi-identity credential isolation.
  decisions:
    - Finalize tool naming and CLI binary branding (resolve namespace availability across package managers).
    - Determine distribution packaging (Homebrew tap, single binary, or container bundle).
    - Maintain strict separation between cognitive LLM processor and project runtime containers.
  steps:
    - Formalize the workflow classification layer (spec-to-pr, runbook, investigation, documentation).
    - Containerize the LLM processor (Dockerfile with Claude, Agy, Gemini, Python SDKs and mounted session store).
    - Create quickstart onboarding documentation, architecture wireframe SVGs, and automated installation script.

- id: stack-specific-runners
  status: open
  summary: Evolve runtime container pool slots into specialized, stack-specific Runners (Java, Node, Go, Python, Hugo).
  context: >-
    Currently, platform/runtime uses a single generic devcontainer definition for all worktree runtime slots.
    To support diverse project ecosystems without container bloat, runtime slots will evolve into specialized
    Runners declared per project in config/projects.json (e.g. runner: java, runner: node, runner: hugo).
  decisions:
    - Define runner artifact registry and caching strategy for slot reuse.
    - Standardize interface for the LLM component to execute builds and tests inside the active runner via docker exec.
  steps:
    - Add runner attribute to config/projects.json schema.
    - Create modular runner Dockerfiles or devcontainer feature layers (runner-base, runner-node, runner-java, runner-hugo, runner-python).
    - Update platform/runtime/scripts/start.sh to resolve and boot the project's designated runner image in the allocated slot.
    - Add runner inspection subcommands to aee runtime slots.


