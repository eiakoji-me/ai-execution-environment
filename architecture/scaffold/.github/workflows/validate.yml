name: Validate workspace

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes gettext-base jq shellcheck

      - name: Validate scaffold
        run: ./platform/validate.sh

      - name: Test runtime CLI
        run: ./platform/tests/runtime-cli.sh

      - name: Test runtime lifecycle
        run: ./platform/tests/runtime-lifecycle.sh

      - name: Test workspace scaffolder
        run: ./platform/tests/workspace-scaffolder.sh

      - name: Test setup profiles
        run: ./platform/tests/setup-profiles.sh

      - name: Test Claude Code interface
        run: ./platform/tests/claude-interface.sh

      - name: Test identity profiles
        run: ./platform/tests/identity.sh

      - name: Test orchestrator
        run: ./platform/tests/orchestrator.sh
